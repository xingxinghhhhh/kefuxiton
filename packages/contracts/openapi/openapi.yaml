openapi: 3.0.3
info:
  title: AI Customer Service Agent API
  version: 0.1.0
servers:
  - url: http://localhost:3001/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service health
  /conversations:
    post:
      operationId: createConversation
      responses:
        '201':
          description: Anonymous conversation and one-time access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateConversationResponse'
  /conversations/{conversationId}/messages:
    post:
      operationId: sendMessage
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
            example: Bearer one-time-conversation-token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Persisted user message and deterministic knowledge or safe fallback response
        '400':
          description: Invalid message
        '401':
          description: Invalid conversation credentials
    get:
      operationId: getConversationMessages
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Public messages for the authorized conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessagesResponse'
        '401':
          description: Invalid conversation credentials
  /conversations/{conversationId}/handoff-requests:
    post:
      operationId: requestHandoff
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
            example: Bearer one-time-conversation-token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string, enum: [customer_requested] }
      responses:
        '201':
          description: Idempotent customer handoff request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffRequestResponse'
        '401':
          description: Invalid conversation credentials
    get:
      operationId: getHandoffStatus
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current handoff request or null
        '401':
          description: Invalid conversation credentials
  /conversations/{conversationId}/messages/{messageId}/feedback:
    post:
      operationId: submitMessageFeedback
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: messageId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageFeedbackRequest'
      responses:
        '201':
          description: Fixed synthetic/local-evaluation feedback recorded or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageFeedbackResponse'
        '400': { description: Invalid feedback value or idempotency key }
        '401': { description: Invalid conversation credentials }
        '403': { description: Message is not a public feedback target }
        '409': { description: Feedback or idempotency conflict }
  /staff/handoff-requests:
    get:
      operationId: listStaffHandoffRequests
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [requested, claimed, closed]
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
            example: Staff test-only-token
      responses:
        '200':
          description: Authorized staff handoff queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffHandoffListResponse'
        '401':
          description: Missing or invalid staff identity
        '403':
          description: Insufficient staff permission
  /staff/handoff-requests/{requestId}:
    get:
      operationId: getStaffHandoffRequest
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Authorized staff handoff request with recent messages
        '401':
          description: Missing or invalid staff identity
        '403':
          description: Insufficient staff permission
        '404':
          description: Handoff request not found
  /staff/handoff-requests/{requestId}/claim:
    post:
      operationId: claimStaffHandoffRequest
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Claimed handoff request, idempotently
        '401':
          description: Missing or invalid staff identity
        '403':
          description: Insufficient staff permission
        '409':
          description: Handoff state conflict
  /staff/handoff-requests/{requestId}/close:
    post:
      operationId: closeStaffHandoffRequest
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseHandoffRequest'
      responses:
        '201':
          description: Closed handoff request, idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCloseResponse'
        '400':
          description: Missing one outcome field or unsupported enum
        '401':
          description: Missing or invalid staff identity
        '403':
          description: Insufficient staff permission
        '409':
          description: Handoff state conflict
  /staff/handoff-requests/{requestId}/replies:
    post:
      operationId: sendStaffHandoffReply
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
        - in: header
          name: X-Request-Id
          required: false
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffReplyRequest'
      responses:
        '201':
          description: Human operator reply, idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffReplyResponse'
        '400':
          description: Invalid reply content or idempotency key
        '401':
          description: Missing or invalid staff identity
        '403':
          description: Insufficient staff permission or not the claiming operator
        '409':
          description: Handoff is not claimed
  /staff/handoff-requests/{requestId}/internal-context:
    get:
      operationId: getStaffInternalContext
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Internal-only notes and fixed tags for the claiming operator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffInternalContextResponse' }
        '401': { description: Missing or invalid staff identity }
        '403': { description: Insufficient permission or non-owner operator }
        '409': { description: Handoff is not claimed }
  /staff/handoff-requests/{requestId}/timeline:
    get:
      operationId: getStaffAuditTimeline
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: cursor
          required: false
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Redacted read-only audit timeline for an authorized Staff operator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAuditTimelineResponse' }
        '400': { description: Invalid limit or cursor }
        '401': { description: Missing or invalid staff identity }
        '403': { description: Insufficient staff permission }
        '404': { description: Handoff request not found }
  /staff/handoff-requests/{requestId}/notes:
    post:
      operationId: createStaffInternalNote
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalNoteRequest' }
      responses:
        '201':
          description: Internal-only note, idempotently
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalNoteResponse' }
        '400': { description: Invalid note or idempotency key }
        '401': { description: Missing or invalid staff identity }
        '403': { description: Insufficient permission or non-owner operator }
        '409': { description: Handoff is not claimed }
  /staff/handoff-requests/{requestId}/tags:
    post:
      operationId: addStaffInternalTag
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalTagRequest' }
      responses:
        '201': { description: Fixed internal tag, idempotently }
        '400': { description: Invalid tag or idempotency key }
        '401': { description: Missing or invalid staff identity }
        '403': { description: Insufficient permission or non-owner operator }
        '409': { description: Handoff is not claimed }
  /staff/handoff-requests/{requestId}/tags/{tag}:
    delete:
      operationId: removeStaffInternalTag
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: tag
          required: true
          schema: { type: string, enum: [urgent, billing, technical, follow_up] }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { description: Fixed internal tag removal, idempotently }
        '400': { description: Invalid tag or idempotency key }
        '401': { description: Missing or invalid staff identity }
        '403': { description: Insufficient permission or non-owner operator }
        '409': { description: Handoff is not claimed }
components:
  schemas:
    CreateConversationResponse:
      type: object
      required: [conversationId, accessToken, status, createdAt]
      properties:
        conversationId: { type: string, format: uuid }
        accessToken: { type: string }
        status: { type: string, enum: [active, closed] }
        createdAt: { type: string, format: date-time }
    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
    Citation:
      type: object
      required: [id, title, uri]
      properties:
        id: { type: string }
        title: { type: string }
        uri: { type: string }
        version: { type: string }
        locator: { type: string }
        contentSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    SendMessageResponse:
      type: object
      required: [conversationId, messages, agentMode, responseType, citations, handoffRecommended, handoffStatus]
      properties:
        conversationId: { type: string, format: uuid }
        messages: { type: array, items: { $ref: '#/components/schemas/MessageView' } }
        agentMode: { type: string, enum: [mock, deterministic_knowledge, handoff, human_operator] }
        responseType: { type: string, enum: [safe_unavailable, knowledge_answer, handoff_recommended, handoff_requested, handoff_pending, human_reply, mock_fallback] }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
        handoffRecommended: { type: boolean }
        handoffStatus: { type: string, nullable: true, enum: [requested, claimed, closed] }
        handoffRequestId: { type: string, format: uuid, nullable: true }
        assistantMessageId: { type: string, format: uuid, nullable: true }
    ConversationMessagesResponse:
      type: object
      required: [conversationId, messages]
      properties:
        conversationId: { type: string, format: uuid }
        messages: { type: array, items: { $ref: '#/components/schemas/MessageView' } }
    MessageView:
      type: object
      required: [id, role, content, responseType, agentMode, senderType, citations, createdAt, feedback]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, agent] }
        content: { type: string }
        responseType: { type: string, nullable: true, enum: [safe_unavailable, knowledge_answer, handoff_recommended, handoff_requested, handoff_pending, human_reply, mock_fallback] }
        agentMode: { type: string, nullable: true, enum: [mock, deterministic_knowledge, handoff, human_operator] }
        senderType: { type: string, enum: [customer, ai, human_operator, system] }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
        createdAt: { type: string, format: date-time }
        feedback: { allOf: [{ $ref: '#/components/schemas/MessageFeedbackSummary' }], nullable: true }
    MessageFeedbackRequest:
      type: object
      required: [value, idempotencyKey]
      additionalProperties: false
      properties:
        value: { type: string, enum: [helpful, not_helpful], description: Synthetic/local-evaluation label only; not a formal satisfaction policy. }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
    MessageFeedbackSummary:
      type: object
      required: [value, submittedAt]
      properties:
        value: { type: string, enum: [helpful, not_helpful] }
        submittedAt: { type: string, format: date-time }
    MessageFeedbackResponse:
      type: object
      required: [feedbackId, conversationId, messageId, value, status, idempotent]
      properties:
        feedbackId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        value: { type: string, enum: [helpful, not_helpful] }
        status: { type: string, enum: [recorded, replayed, already_recorded] }
        idempotent: { type: boolean }
    StaffReplyRequest:
      type: object
      required: [content, idempotencyKey]
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
    StaffReplyResponse:
      type: object
      required: [requestId, replyId, message, idempotent]
      properties:
        requestId: { type: string, format: uuid }
        replyId: { type: string, format: uuid }
        message: { $ref: '#/components/schemas/MessageView' }
        idempotent: { type: boolean }
    InternalNoteRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
    InternalNoteResponse:
      type: object
      required: [requestId, note, idempotent]
      properties:
        requestId: { type: string, format: uuid }
        note: { $ref: '#/components/schemas/InternalNote' }
        idempotent: { type: boolean }
    InternalNote:
      type: object
      required: [id, content, operatorId, createdAt]
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        operatorId: { type: string }
        createdAt: { type: string, format: date-time }
    InternalTagRequest:
      type: object
      required: [tag]
      properties:
        tag: { type: string, enum: [urgent, billing, technical, follow_up] }
    StaffInternalContextResponse:
      type: object
      required: [requestId, conversationId, notes, tags]
      properties:
        requestId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        notes: { type: array, items: { $ref: '#/components/schemas/InternalNote' } }
        tags:
          type: array
          items:
            type: object
            required: [tag, operatorId, createdAt]
            properties:
              tag: { type: string, enum: [urgent, billing, technical, follow_up] }
              operatorId: { type: string }
              createdAt: { type: string, format: date-time }
    StaffAuditTimelineResponse:
      type: object
      required: [requestId, conversationId, items, nextCursor]
      properties:
        requestId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        nextCursor: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            required: [eventId, occurredAt, actorType, actorRef, action, result, subjectType, subjectRef, tag, closeReason, resolutionCode, feedbackValue]
            properties:
              eventId: { type: string, format: uuid }
              occurredAt: { type: string, format: date-time }
              actorType: { type: string, enum: [customer, operator, system] }
              actorRef: { type: string, nullable: true }
              action:
                type: string
                enum: [handoff_requested, handoff_request_replayed, handoff_claimed, handoff_claim_replayed, handoff_closed, handoff_close_replayed, operator_reply_created, operator_reply_replayed, internal_note_created, internal_note_replayed, conversation_tag_added, conversation_tag_removed, message_feedback_created, message_feedback_replayed, message_feedback_conflict]
              result: { type: string, enum: [succeeded, replayed, rejected] }
              subjectType: { type: string, enum: [handoff_request, message, internal_note, conversation_tag] }
              subjectRef: { type: string, nullable: true }
              tag: { type: string, nullable: true, enum: [urgent, billing, technical, follow_up] }
              closeReason: { type: string, nullable: true, enum: [operator_completed, customer_requested_close, duplicate_request, out_of_scope, unable_to_resolve, legacy_unclassified] }
              resolutionCode: { type: string, nullable: true, enum: [resolved, partially_resolved, unresolved, no_action_required, legacy_unclassified] }
              feedbackValue: { type: string, nullable: true, enum: [helpful, not_helpful] }
    HandoffRequestResponse:
      type: object
      required: [conversationId, requestId, status, reasonCode, requestedAt, updatedAt, idempotent]
      properties:
        conversationId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        status: { type: string, enum: [requested, claimed, closed] }
        reasonCode: { type: string, enum: [customer_requested] }
        requestedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        idempotent: { type: boolean }
        claimedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
    HandoffActionResponse:
      type: object
      required: [requestId, status, idempotent]
      properties:
        requestId: { type: string, format: uuid }
        status: { type: string, enum: [requested, claimed, closed] }
        idempotent: { type: boolean }
    CloseHandoffRequest:
      type: object
      description: New clients provide both fields. An empty body is accepted only for legacy compatibility and is stored as legacy_unclassified.
      properties:
        closeReason: { type: string, enum: [operator_completed, customer_requested_close, duplicate_request, out_of_scope, unable_to_resolve] }
        resolutionCode: { type: string, enum: [resolved, partially_resolved, unresolved, no_action_required] }
    StaffCloseResponse:
      type: object
      required: [requestId, status, closeReason, resolutionCode, idempotent]
      properties:
        requestId: { type: string, format: uuid }
        status: { type: string, enum: [closed] }
        closeReason: { type: string, nullable: true, enum: [operator_completed, customer_requested_close, duplicate_request, out_of_scope, unable_to_resolve, legacy_unclassified] }
        resolutionCode: { type: string, nullable: true, enum: [resolved, partially_resolved, unresolved, no_action_required, legacy_unclassified] }
        idempotent: { type: boolean }
    StaffHandoffListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffHandoffRequest'
    StaffHandoffRequest:
      type: object
      required: [requestId, conversationId, status, reasonCode, requestedAt, updatedAt, claimedBy, claimedAt, closedAt, closeReason, resolutionCode, recentMessages]
      properties:
        requestId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        status: { type: string, enum: [requested, claimed, closed] }
        reasonCode: { type: string }
        requestedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        claimedBy: { type: string, nullable: true }
        claimedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        closeReason: { type: string, nullable: true, enum: [operator_completed, customer_requested_close, duplicate_request, out_of_scope, unable_to_resolve, legacy_unclassified] }
        resolutionCode: { type: string, nullable: true, enum: [resolved, partially_resolved, unresolved, no_action_required, legacy_unclassified] }
        recentMessages:
          type: array
          items:
            type: object
            required: [id, role, senderType, content, createdAt]
            properties:
              id: { type: string, format: uuid }
              role: { type: string, enum: [user, agent] }
              senderType: { type: string, enum: [customer, ai, human_operator, system] }
              content: { type: string }
              createdAt: { type: string, format: date-time }
